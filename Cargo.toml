[workspace]
resolver = "2"
members = ["crates/api", "crates/controller", "crates/cli", "crates/xtask", "crates/e2e"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://git.kubexa.tech/oss/hydradb-operator"

[workspace.dependencies]
kube = { version = "5.1.0", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "ws", "ring"] }
# One version only, and it must carry a v1_* feature: k8s-openapi's build script
# panics with "None of the v1_* features are enabled" otherwise, and a second
# k8s-openapi version in the tree fails the same way. kube 5.1 resolves 0.29.
k8s-openapi = { version = "0.29.0", features = ["v1_36"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tower = "0.5"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
tower-test = "0.4"
envtest = "0.3"
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
subtle = "2"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.34"
