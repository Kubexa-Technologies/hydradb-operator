[workspace]
resolver = "2"
members = ["crates/api", "crates/controller", "crates/cli", "crates/xtask", "crates/e2e"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://git.kubexa.tech/oss/hydradb-operator"

[workspace.dependencies]
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "ws", "ring"] }
k8s-openapi = { version = "0.28.0", features = ["v1_33"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tower = "0.5"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tower-test = "0.4"
rand = "0.9"
sha2 = "0.10"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.33"
