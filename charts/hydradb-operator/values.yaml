# SPDX-License-Identifier: Apache-2.0
#
# hydradb-operator values.
#
# SCOPE — read this first:
#   This chart deploys ONLY the operator (the controller Deployment, its RBAC,
#   ServiceAccount, Service, PDB, NetworkPolicy and optional ServiceMonitor).
#
#   It does NOT configure a HydraDB cluster. Graphs, node pools, indexers,
#   backups and ingest sources are declared with the custom resources
#   (GraphCluster / GraphNodePool / GraphIndexer / GraphBackup /
#   GraphIngestSource) and their spec is owned by those objects. Nothing in this
#   file can change how a graph runs: image, storage, auth, TLS, tuning and
#   scaling all live on the CRs.
#
#   Rule of thumb: if the setting describes the *controller process or its pod*,
#   it belongs here. If it describes the *database*, it belongs on a CR.

# -- Operator container image repository (registry + path).
image:
  # -- Operator container image repository (registry + path).
  repository: harbor.kubexa.tech/oss/hydradb-operator
  # -- Operator container image tag (pinned semver; never "latest").
  tag: v0.1.0
  # -- Pinned image digest (sha256 hex without the "sha256:" prefix); empty means tag only.
  digest: ""
  # -- Image pull policy (IfNotPresent, Always, or Never).
  pullPolicy: IfNotPresent
  # -- Image pull secrets for private registries.
  pullSecrets: []

# -- Number of operator Deployment replicas.
#
# >1 is safe: the leader-election lease elects exactly one active reconciler and
# the others stay ready but idle (they serve /readyz as 503 until promoted).
replicaCount: 2

# -- Operator container resource requests and limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Node selector for operator pods (e.g. pin to an architecture).
nodeSelector: {}
# -- Tolerations for operator pods.
tolerations: []
# -- Affinity for operator pods.
affinity: {}
# -- Topology spread constraints for operator pods (HA scheduling).
topologySpreadConstraints: []
# -- Priority class ensuring the controller survives node pressure.
priorityClassName: ""

# -- ServiceAccount for the operator Deployment.
serviceAccount:
  # -- Create the ServiceAccount (set false to use a pre-existing one).
  create: true
  # -- Override the ServiceAccount name (empty uses the chart fullname).
  name: ""
  # -- Annotations, e.g. eks.amazonaws.com/role-arn for IRSA.
  annotations: {}
  # -- Mount the API token into the pod (required for in-cluster operation).
  automount: true

# -- Extra annotations for operator pods.
podAnnotations: {}
# -- Extra labels for operator pods.
podLabels: {}
# -- Extra environment variables for the operator container.
#
# This is the supported way to configure the controller process:
#   OPERATOR_SCOPE, OPERATOR_NAMESPACE, RUST_LOG, RUST_BACKTRACE,
#   OTEL_EXPORTER_OTLP_ENDPOINT, OPERATOR_WEBHOOK_ADDR,
#   OPERATOR_INGEST_ALLOWED_SERVICE_ACCOUNTS (comma-separated list; empty means
#   only `default`, and the operator's own SA is always refused).
extraEnv: []
# -- Extra command-line arguments for the operator binary.
extraArgs: []
# -- Grace period for operator pod termination, in seconds.
terminationGracePeriodSeconds: 30
# -- Number of old ReplicaSets retained for rollback.
revisionHistoryLimit: 3

# -- Ingest webhook receiver: the controller's authenticated HTTP endpoint that
# starts GraphIngestSource runs on push. It configures the RECEIVER, not the
# ingest job (which is defined on the GraphIngestSource CR).
webhook:
  # -- Expose the receiver and its Service.
  enabled: false
  # -- Container/Service port the receiver listens on.
  port: 8081
  service:
    # -- Service type for the receiver (ClusterIP, NodePort, LoadBalancer).
    type: ClusterIP
    # -- Annotations for the receiver Service (e.g. MetalLB address pinning).
    annotations: {}

# -- Operator watch scope: "namespaced" watches OPERATOR_NAMESPACE only,
# "cluster" watches all namespaces. Use "cluster" when the GraphCluster CRs live
# in namespaces other than the release namespace.
installScope: namespaced

# -- Monitoring integration for the operator.
monitoring:
  serviceMonitor:
    # -- Create a ServiceMonitor scraping the operator's /metrics.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Extra labels for the ServiceMonitor (e.g. your Prometheus release selector).
    labels: {}

# -- HydraDB CRDs (GraphCluster, GraphNodePool, GraphIndexer, GraphBackup,
# GraphIngestSource).
#
# IMPORTANT — Helm only reads crds/ on `helm install`, never on `helm upgrade`.
# So `install: true` means "present after a fresh install", NOT "kept in sync".
# To upgrade CRDs with the chart version you must either:
#   * Flux: set upgrade.crds: CreateReplace on the HelmRelease (what this repo
#     does for hydradb), or
#   * plain Helm: `kubectl apply --server-side -f charts/hydradb-operator/crds/`
#     as a separate, reviewable step.
# Set install: false when CRDs are managed outside the release entirely.
crds:
  install: true

# -- Operator log configuration.
log:
  # -- RUST_LOG filter directive for the controller.
  level: info

# -- Operator PodDisruptionBudget.
pdb:
  # -- Create a PDB for the operator pods.
  enabled: true
  # -- Pods that must remain available during voluntary disruption.
  minAvailable: 1

# -- Operator NetworkPolicy (ingress to the health/metrics port, DNS + API + S3 egress).
networkPolicy:
  enabled: true
