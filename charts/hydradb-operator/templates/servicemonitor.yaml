{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hydradb-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hydradb-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hydradb-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: healthz
      path: /metrics
      interval: 30s
{{- end }}
