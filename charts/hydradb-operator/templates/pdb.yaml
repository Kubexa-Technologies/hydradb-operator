{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hydradb-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hydradb-operator.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "hydradb-operator.selectorLabels" . | nindent 6 }}
{{- end }}
