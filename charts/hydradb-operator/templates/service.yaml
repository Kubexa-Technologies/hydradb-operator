apiVersion: v1
kind: Service
metadata:
  name: {{ include "hydradb-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hydradb-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hydradb-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: healthz
      port: 8080
      targetPort: healthz
      protocol: TCP
