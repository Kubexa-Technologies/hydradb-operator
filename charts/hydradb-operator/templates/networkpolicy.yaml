{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hydradb-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hydradb-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hydradb-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        {{- if .Values.webhook.enabled }}
        - port: {{ .Values.webhook.port }}
          protocol: TCP
        {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 443/6443: object storage + apiserver. 9090/9091: the operand's admin and
    # indexer metrics ports, which the controller scrapes to publish
    # status.indexing. Omitting them makes that scrape fail silently and leaves
    # the operator looking permanently "unreachable".
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
{{- end }}
