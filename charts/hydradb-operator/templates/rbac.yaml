{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{/* RBAC sourced from `cargo xtask gen-rbac` output (deploy/rbac/operator-clusterrole.yaml). */}}
{{/* installScope=namespaced renders Role/RoleBinding; installScope=cluster renders ClusterRole/ClusterRoleBinding. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "hydradb-operator.rbacKind" . }}
metadata:
  name: {{ include "hydradb-operator.fullname" . }}
  {{- if eq .Values.installScope "namespaced" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "hydradb-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - hydradb.helmforge.dev
    resources:
      - graphclusters
      - graphnodepools
      - graphindexers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - hydradb.helmforge.dev
    resources:
      - graphclusters/status
      - graphnodepools/status
      - graphindexers/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - patch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - objectbucket.io
    resources:
      - objectbucketclaims
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "hydradb-operator.bindingKind" . }}
metadata:
  name: {{ include "hydradb-operator.fullname" . }}
  {{- if eq .Values.installScope "namespaced" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "hydradb-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hydradb-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ include "hydradb-operator.rbacKind" . }}
  name: {{ include "hydradb-operator.fullname" . }}
