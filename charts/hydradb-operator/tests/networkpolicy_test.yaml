# SPDX-License-Identifier: Apache-2.0
suite: NetworkPolicy guard
templates:
  - networkpolicy.yaml
tests:
  - it: renders a NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: NetworkPolicy
        documentSelector:
          path: kind
          value: NetworkPolicy

  - it: renders no NetworkPolicy when disabled
    set:
      networkPolicy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
