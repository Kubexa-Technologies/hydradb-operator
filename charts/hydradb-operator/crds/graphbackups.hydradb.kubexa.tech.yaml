              retention:
                default: 3
                description: |-
                  How many completed runs (and the copies they produced) to keep.
                  
                  The operator prunes its own finished `Job` records beyond this count and
                  passes the value to the copier as `HYDRADB_BACKUP_RETENTION`, because
                  only the copier can enumerate the object copies it wrote. Must be at
                  least 1.
                format: int32
                minimum: 1.0
                type: integer
              schedule:
                description: |-
                  Cron schedule in standard five-field form.
                  
                  Absent means "take exactly one backup now": the controller creates a
                  single `Job` and never replaces it, even after it fails (owner decides).
                nullable: true
                type: string
              successfulJobsHistoryLimit:
                default: 3
                description: "`successfulJobsHistoryLimit` of the owned `CronJob` (default 3)."
                format: int32
                nullable: true
                type: integer
              suspend:
                default: false
                description: Suspend future scheduled runs; an in-flight run is left alone.
                type: boolean
              target:
                description: Where the copy is written.
                properties:
                  prefix:
                    description: |-
                      Prefix inside the target bucket.
                      
                      Absent means `backups/<namespace>/<cluster-name>` computed by the
                      controller, so two clusters in one namespace never collide.
                    nullable: true
                    type: string
                  store:
                    description: |-
                      Object-store location the copy is written to.
                      
