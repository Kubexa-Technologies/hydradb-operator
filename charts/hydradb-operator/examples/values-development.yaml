# SPDX-License-Identifier: Apache-2.0
# Development example: minimal local install.
# Namespaced scope (safest default), debug logging, guards off for speed.
image:
  repository: harbor.kubexa.tech/oss/hydradb-operator
  tag: v0.1.0
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
installScope: namespaced
monitoring:
  serviceMonitor:
    enabled: false
crds:
  install: true
log:
  level: debug
pdb:
  enabled: false
networkPolicy:
  enabled: false
