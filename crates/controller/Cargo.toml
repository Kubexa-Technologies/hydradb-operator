[package]
name = "hydradb-operator"
description = "HydraDB Kubernetes operator controller (owns k8s-openapi)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hydradb-operator"
path = "src/main.rs"

[features]
# The envtest integration suite needs Go and libclang at build time: its envtest
# dependency runs "go build" from a build script. A default build therefore has
# to stay free of it, or every cargo gate in CI dies with
# "Go build failed: No such file or directory" before a single test runs.
envtest-tests = ["dep:envtest"]
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
hydradb-operator-api = { path = "../api", version = "0.1.0" }
kube.workspace = true
k8s-openapi.workspace = true
axum = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
chrono.workspace = true
uuid.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dependencies.envtest]
workspace = true
optional = true

[dev-dependencies]
tower = { workspace = true }
tower-test.workspace = true
http = "1"
