apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: graphclusters.hydradb.helmforge.dev
spec:
  group: hydradb.helmforge.dev
  names:
    categories:
    - hydradb
    kind: GraphCluster
    plural: graphclusters
    shortNames:
    - hgc
    singular: graphcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for GraphClusterSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Top-level HydraDB cluster.
              
              `#[kube(scale)]` is deliberately omitted: replica counts live on
              `GraphNodePool`, never here.
            properties:
              auth:
                default:
                  generate: false
                description: Client-auth configuration.
                properties:
                  existingSecret:
                    description: Name of an existing Secret holding the token; empty means generated.
                    nullable: true
                    type: string
                  generate:
                    default: false
                    description: Generate a token when no existing Secret supplies one.
                    type: boolean
                  secretKey:
                    description: Key inside the auth Secret holding the token.
                    nullable: true
                    type: string
                  token:
                    description: Inline token (testing only; prefer a Secret reference).
                    nullable: true
                    type: string
                type: object
              deletionPolicy:
                default: Retain
                description: What happens to backing data on cluster deletion.
                enum:
                - Retain
                - Delete
                type: string
              extraEnv:
                description: |-
                  Extra environment variables applied to every operand pod of the cluster.
                  
                  Pool- and indexer-level `extraEnv` are merged on top of these, so a
                  pool can override a cluster-wide default. Variables that the operator
                  itself owns (`GRAPH_NAMESPACE`, `GRAPH_ID`, ...) cannot be overridden:
                  those are rejected during validation.
                items:
                  description: EnvVar represents an environment variable present in a Container.
                  properties:
                    name:
                      description: >-
                        Name of the environment variable. May consist of any printable ASCII characters
                        except '='.
                      type: string
                    value:
                      description: "Variable references $(VAR_NAME) are expanded using the previously defined environment variables in the container and any service environment variables. If a variable cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. \"$$(VAR_NAME)\" will produce the string literal \"$(VAR_NAME)\". Escaped references will never be expanded, regardless of whether the variable exists or not. Defaults to \"\"."
                      type: string
                    valueFrom:
                      description: >-
                        Source for the environment variable's value. Cannot be used if value is not
                        empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              description: "Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names"
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key must be defined
                              type: boolean
                          required:
                          - key
                          - name
                          type: object
                        fieldRef:
                          description: "Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`, spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs."
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                        fileKeyRef:
                          description: >-
                            FileKeyRef selects a key of the env file. Requires the EnvFiles feature gate to
                            be enabled.
                          properties:
                            key:
                              description: >-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters
                                except '='. During Alpha stage of the EnvFiles feature gate, the key size is
                                limited to 128 characters.
                              type: string
                            optional:
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key does not exist, then the env var is not published. If optional is set to true and the specified key does not exist, the environment variable will not be set in the Pod's containers.
                                
                                If optional is set to false and the specified key does not exist, an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: >-
                                The path within the volume from which to select the file. Must be relative and
                                may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                        resourceFieldRef:
                          description: "Selects a resource of the container: only resources limits and requests (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported."
                          properties:
                            containerName:
                              description: "Container name: required for volumes, optional for env vars"
                              type: string
                            divisor:
                              description: Specifies the output format of the exposed resources, defaults to "1"
                              nullable: true
                              x-kubernetes-int-or-string: true
                            resource:
                              description: "Required: resource to select"
                              type: string
                          required:
                          - resource
                          type: object
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must be a valid secret key.
                              type: string
                            name:
                              description: "Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names"
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must be defined
                              type: boolean
                          required:
                          - key
                          - name
                          type: object
                      type: object
                  required:
                  - name
                  type: object
                type: array
              graph:
                description: Graph identity served by this cluster.
                properties:
                  cellId:
                    description: Primary cell served by this cluster (`GRAPH_CELL_ID`).
                    type: string
                  database:
                    description: HydraDB database name (`GRAPH_DATABASE`).
                    type: string
                  id:
                    description: HydraDB graph id (`GRAPH_ID`).
                    type: string
                  namespace:
                    description: Root tenant namespace (`GRAPH_NAMESPACE`).
                    type: string
                  subnamespaces:
                    description: |-
                      Nested subnamespaces below the root, outermost first.
                      
                      The operand addresses a graph inside a namespace tree whose depth is at
                      most eight levels including the root, so at most seven entries are
                      allowed here. Each entry is a single component (no dots); the controller
                      joins the whole path for the node's `GRAPH_SUBNAMESPACE_PATH` env var and
                      keeps the root in `GRAPH_NAMESPACE`.
                    items:
                      type: string
                    type: array
                required:
                - cellId
                - database
                - id
                - namespace
                type: object
              image:
                description: Operand container image.
                properties:
                  digest:
                    description: Pinned image digest (without the `sha256:` prefix handling by runtime).
                    nullable: true
                    type: string
                  pullPolicy:
                    description: Image pull policy. Closed enum.
                    enum:
                    - IfNotPresent
                    - Always
                    - Never
                    nullable: true
                    type: string
                  pullSecrets:
                    description: Secrets used to pull the image.
                    items:
                      description: >-
                        LocalObjectReference contains enough information to let you locate the
                        referenced object inside the same namespace.
                      properties:
                        name:
                          description: "Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names"
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  repository:
                    description: Image repository (registry + path), e.g. `example.com/org/hydradb`.
                    type: string
                  tag:
                    description: Image tag. Mutually combinable with `digest`; never `:latest`.
                    nullable: true
                    type: string
                required:
                - repository
                type: object
              monitoring:
                default:
                  prometheusRule:
                    enabled: false
                  serviceMonitor:
                    enabled: false
                description: Monitoring integration (ServiceMonitor/PrometheusRule opt-in).
                properties:
                  prometheusRule:
                    default:
                      enabled: false
                    description: Prometheus `PrometheusRule` settings (opt-in, off by default).
                    properties:
                      enabled:
                        default: false
                        description: |-
                          Create a `PrometheusRule` with the operator's alert set.
                          Off by default: enabling it requires prometheus-operator CRDs.
                        type: boolean
                      labels:
                        additionalProperties:
                          type: string
                        description: Extra labels merged onto the `PrometheusRule` (e.g. `release`).
                        type: object
                    type: object
                  serviceMonitor:
                    default:
                      enabled: false
                    description: Prometheus `ServiceMonitor` settings.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          Create a `ServiceMonitor` selecting the cluster metrics Services.
                          Off by default: enabling it would force prometheus-operator CRDs
                          to be installed (upstream parity).
                        type: boolean
                    type: object
                type: object
              objectStore:
                description: Backing object store (exactly one source; validated by todo 11).
                properties:
                  explicit:
                    description: Inline S3-compatible configuration.
                    nullable: true
                    properties:
                      allowHttp:
                        default: false
                        description: Allow plain-HTTP endpoints (non-TLS, testing only).
                        type: boolean
                      bucket:
                        description: Bucket name. Required when `explicit` is selected.
                        type: string
                      credentialsSecretRef:
                        description: Secret holding the object-store credentials.
                        nullable: true
                        properties:
                          name:
                            description: "Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names"
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        description: Custom endpoint override. Empty/absent means the provider default.
                        nullable: true
                        type: string
                      region:
                        description: Region, e.g. `us-east-1`.
                        nullable: true
                        type: string
                    required:
                    - bucket
                    type: object
                  objectBucketClaim:
                    description: Reference to an `ObjectBucketClaim` provisioning the bucket.
                    nullable: true
                    properties:
                      name:
                        description: "Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names"
                        type: string
                    required:
                    - name
                    type: object
                type: object
              restoreFrom:
                description: One-shot restore performed before the cluster starts serving.
                nullable: true
                properties:
                  image:
                    description: Image running the restore job.
                    properties:
                      digest:
                        description: Pinned image digest (without the `sha256:` prefix handling by runtime).
                        nullable: true
                        type: string
                      pullPolicy:
                        description: Image pull policy. Closed enum.
                        enum:
                        - IfNotPresent
                        - Always
                        - Never
                        nullable: true
                        type: string
                      pullSecrets:
                        description: Secrets used to pull the image.
                        items:
                          description: >-
                            LocalObjectReference contains enough information to let you locate the
                            referenced object inside the same namespace.
                          properties:
                            name:
                              description: "Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names"
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      repository:
                        description: Image repository (registry + path), e.g. `example.com/org/hydradb`.
                        type: string
                      tag:
                        description: Image tag. Mutually combinable with `digest`; never `:latest`.
                        nullable: true
                        type: string
                    required:
                    - repository
                    type: object
                  store:
                    description: "Backup location: bucket, endpoint, region and credentials."
                    properties:
                      allowHttp:
                        default: false
                        description: Allow plain-HTTP endpoints (non-TLS, testing only).
                        type: boolean
                      bucket:
                        description: Bucket name. Required when `explicit` is selected.
                        type: string
                      credentialsSecretRef:
                        description: Secret holding the object-store credentials.
                        nullable: true
                        properties:
                          name:
                            description: "Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names"
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        description: Custom endpoint override. Empty/absent means the provider default.
                        nullable: true
                        type: string
                      region:
                        description: Region, e.g. `us-east-1`.
                        nullable: true
                        type: string
                    required:
                    - bucket
                    type: object
                  verify:
                    default: true
                    description: Verify the restored object set before the cluster starts.
                    type: boolean
                required:
                - image
                - store
                type: object
              runtime:
                default:
                  dataCacheMaxOpenFiles: 512
                  maxConcurrentQueries: 256
                  maxOpenScopes: 8
                  maxQueryScanEdges: 1000000
                  readerWalReplayConcurrency: 16
                  rustLog: info,hydradb=info
                  slatedbCacheBytes: 671088640
                description: Operand runtime knobs.
                properties:
                  dataCacheMaxOpenFiles:
                    default: 512
                    description: Process-wide file handles limit for SlateDB's disk caches.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  maxConcurrentQueries:
                    default: 256
                    description: Maximum concurrent queries served.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  maxOpenScopes:
                    default: 8
                    description: Maximum read-only scope handles retained between cycles.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  maxQueryScanEdges:
                    default: 1000000
                    description: Maximum edges scanned by a single query.
                    format: uint64
                    minimum: 0.0
                    type: integer
                  readerWalReplayConcurrency:
                    default: 16
                    description: Parallel WAL reads used to establish a cold SlateDB reader.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  rustLog:
                    default: info,hydradb=info
                    description: Tracing/logging filter directive (`RUST_LOG`).
                    type: string
                  slatedbCacheBytes:
                    default: 671088640
                    description: Process-wide SlateDB RAM cache budget in bytes.
                    format: uint64
                    minimum: 0.0
                    type: integer
                type: object
              service:
                default:
                  adminPort: 9090
                  boltPort: 7687
                  httpsPort: 443
                description: Service ports.
                properties:
                  adminPort:
                    default: 9090
                    description: Admin/metrics port (default 9090).
                    format: uint16
                    maximum: 65535.0
                    minimum: 1.0
                    type: integer
                  boltPort:
                    default: 7687
                    description: Bolt port (default 7687).
                    format: uint16
                    maximum: 65535.0
                    minimum: 1.0
                    type: integer
                  httpsPort:
                    default: 443
                    description: HTTPS port (default 443).
                    format: uint16
                    maximum: 65535.0
                    minimum: 1.0
                    type: integer
                type: object
              tls:
                default:
                  enabled: false
                description: TLS configuration.
                properties:
                  additionalDnsNames:
                    description: Extra DNS names on the serving certificate.
                    items:
                      type: string
                    type: array
                  enabled:
                    default: false
                    description: Enable TLS on the public endpoints.
                    type: boolean
                  issuerRef:
                    description: |-
                      cert-manager issuer used to obtain the serving certificate.
                      
                      When set, the controller owns a `cert-manager.io/v1 Certificate` named
                      `<cluster>-tls` whose secret lands in `secretName`'s slot (that name, or
                      `<cluster>-tls` when `secretName` is absent).
                    nullable: true
                    properties:
                      group:
                        default: cert-manager.io
                        description: API group of the issuer. Empty means `cert-manager.io`.
                        type: string
                      kind:
                        default: ClusterIssuer
                        description: "Kind of the referenced issuer: `Issuer` or `ClusterIssuer`."
                        type: string
                      name:
                        description: Name of the `Issuer`/`ClusterIssuer` (or external issuer) object.
                        type: string
                    required:
                    - name
                    type: object
                  secretName:
                    description: |-
                      Secret holding the serving certificate. Mutually exclusive with
                      `issuerRef`; at least one of the two is required when `enabled`.
                    nullable: true
                    type: string
                type: object
              tuning:
                default:
                  connection: {}
                  engine: {}
                  graphblas: {}
                  placement: {}
                  query: {}
                  storage: {}
                description: |-
                  Typed tuning surface for the operand's optional limits.
                  
                  Preferred over `extraEnv`: every leaf is validated and only set leaves
                  produce an env var.
                properties:
                  connection:
                    default: {}
                    description: Bolt connection management.
                    properties:
                      authenticationTimeoutMs:
                        description: Authentication handshake timeout in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      gracefulShutdownMs:
                        description: Graceful shutdown drain window in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      idleTimeoutMs:
                        description: Idle timeout in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxAgeMs:
                        description: Maximum connection age in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxConnections:
                        description: Maximum concurrent Bolt connections.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                    type: object
                  engine:
                    default: {}
                    description: Query-engine selectors.
                    properties:
                      compiledKernel:
                        description: Compiled-kernel selector.
                        nullable: true
                        type: string
                      cypherEngine:
                        description: OpenCypher engine selector.
                        nullable: true
                        type: string
                      profileMatrix:
                        description: Emit matrix profiling telemetry.
                        nullable: true
                        type: boolean
                      sparseKernel:
                        description: Sparse-kernel selector.
                        nullable: true
                        type: string
                    type: object
                  graphblas:
                    default: {}
                    description: GraphBLAS matrix budgets.
                    properties:
                      maxAdjacencies:
                        description: Matrix adjacencies held at once.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxAdjacencyBytes:
                        description: Byte ceiling for one adjacency.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxBytes:
                        description: Byte ceiling for all compiled matrices.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxConcurrentCompilations:
                        description: Concurrent matrix compilations.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxMatrices:
                        description: Compiled matrices held at once.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                    type: object
                  placement:
                    default: {}
                    description: Placement, writer lease and read routing.
                    properties:
                      heartbeatIntervalMs:
                        description: Placement heartbeat interval in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      heartbeatTimeoutMs:
                        description: Placement heartbeat expiry in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      indexDiscoveryIntervalMs:
                        description: Index discovery interval in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      readRouting:
                        description: Bolt read-routing policy selector.
                        nullable: true
                        type: string
                      readerManifestPollIntervalMs:
                        description: Follower-reader manifest poll interval in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      writeLanes:
                        description: Concurrent write lanes.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                      writerLeaseMs:
                        description: Durable writer-lease duration in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                    type: object
                  query:
                    default: {}
                    description: Query-execution limits.
                    properties:
                      cursorTtlMs:
                        description: Cursor idle TTL in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      defaultPageSize:
                        description: Default result page size.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxBookmarkWaitMs:
                        description: Bookmark wait ceiling in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxConcurrentHydrations:
                        description: Concurrent metadata hydrations.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxCursorBufferBytes:
                        description: Byte ceiling per cursor buffer.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxRuntimeMs:
                        description: Wall-clock ceiling for one query, in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maxServerCursors:
                        description: Maximum live server-side cursors.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                      slowQueryMs:
                        description: Slow-query logging threshold in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      txnMaxRetries:
                        description: Transaction retry ceiling.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                    type: object
                  storage:
                    default: {}
                    description: Storage and index-artifact batching.
                    properties:
                      artifactGcBatchKeys:
                        description: Key batch size for artifact garbage collection.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                      artifactWriteBatchKeys:
                        description: Key batch size for artifact writes.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                      cachePartBytes:
                        description: Object-store cache chunk size in bytes.
                        format: uint64
                        minimum: 1024.0
                        nullable: true
                        type: integer
                      l0FlushParallelism:
                        description: Parallel L0 flush tasks.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                      l0SstSizeBytes:
                        description: Target L0 SST size in bytes.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                      maintenanceBatchKeys:
                        description: Key batch size for maintenance compaction.
                        format: uint32
                        minimum: 1.0
                        nullable: true
                        type: integer
                      trimMemoryAfterHydration:
                        description: Return hydration scratch memory to the OS after each hydration.
                        nullable: true
                        type: boolean
                      walFlushIntervalMs:
                        description: WAL flush interval in milliseconds.
                        format: uint64
                        minimum: 1.0
                        nullable: true
                        type: integer
                    type: object
                type: object
            required:
            - graph
            - image
            - objectStore
            type: object
          status:
            description: Observed state of a HydraDB cluster.
            nullable: true
            properties:
              conditions:
                description: Standard Kubernetes conditions (`Ready`, etc.).
                items:
                  description: >-
                    Condition contains details for one aspect of the current state of this API
                    Resource.
                  properties:
                    lastTransitionTime:
                      description: >-
                        lastTransitionTime is the last time the condition transitioned from one status
                        to another. This should be when the underlying condition changed.  If that is not
                        known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: >-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      type: string
                    observedGeneration:
                      description: >-
                        observedGeneration represents the .metadata.generation that the condition was
                        set based upon. For instance, if .metadata.generation is currently 12, but the
                        .status.conditions[x].observedGeneration is 9, the condition is out of date with
                        respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: >-
                        reason contains a programmatic identifier indicating the reason for the
                        condition's last transition. Producers of specific condition types may define expected
                        values and meanings for this field, and whether the values are considered a
                        guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoints:
                default: {}
                description: Advertised endpoints.
                properties:
                  admin:
                    description: Admin/metrics endpoint.
                    nullable: true
                    type: string
                  bolt:
                    description: Bolt endpoint (`host:port`).
                    nullable: true
                    type: string
                  https:
                    description: HTTPS endpoint.
                    nullable: true
                    type: string
                type: object
              indexing:
                default:
