---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: hydradb-operator-image-build
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-path-change: "[crates/**, charts/**, Dockerfile, .tekton/hydradb-operator-image-build.yaml]"
spec:
  params:
    - name: repo_url
      value: "{{repo_url}}"
    - name: revision
      value: "{{revision}}"
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      nodeSelector:
        site: svt
  workspaces:
    - name: repo
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              # The inline ci-gate compiles the whole workspace into
              # <repo>/target, so the checkout volume must hold a Rust build.
              storage: 10Gi
          storageClassName: ceph-cephfs
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: docker-credentials
      secret:
        secretName: docker-config-kaniko-oss
  timeouts:
    pipeline: 1h
  pipelineSpec:
    params:
      - name: repo_url
        description: Full hydradb-operator repo URL (PaC {{repo_url}})
      - name: revision
        description: Git commit SHA to build (PaC {{revision}})
    workspaces:
      - name: repo
        description: Repo checkout + build context
      - name: basic-auth
        description: PaC git credentials ({{ git_auth_secret }})
      - name: docker-credentials
        description: Harbor + GHCR push auth (docker-config-kaniko-oss secret, todo 44)
    tasks:
      - name: fetch-source
        params:
          - name: revision
            value: $(params.revision)
        taskSpec:
          params:
            - name: revision
          workspaces:
            - name: repo
            - name: basic-auth
          results:
            - name: semver-tag
              description: "{version from .version file}-{short sha}"
          steps:
            - name: clone
              image: docker.io/alpine/git:2.54.0
              script: |
                set -euo pipefail
                # PaC mounts its git credentials (pac-gitauth-*) here, bound to the
                # external FQDN. Pod->gateway->gitea hairpin 503s, so remap the
                # credential host to the internal service. -c forces this store
                # file so ambient helpers (creds-init etc.) cannot interfere.
                CREDS="$(workspaces.basic-auth.path)/.git-credentials"
                sed -e 's#^https://#http://#' -e 's#@git.kubexa.tech#@gitea-http.gitea:3000#' "$CREDS" > "$HOME/.git-credentials"
                chmod 600 "$HOME/.git-credentials"
                export GIT_TERMINAL_PROMPT=0
                find "$(workspaces.repo.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
                git -c "credential.helper=store --file=$HOME/.git-credentials" clone --depth 1 --no-checkout http://gitea-http.gitea:3000/oss/hydradb-operator.git "$(workspaces.repo.path)"
                git -C "$(workspaces.repo.path)" -c "credential.helper=store --file=$HOME/.git-credentials" fetch --depth 1 origin "$(params.revision)"
                git -C "$(workspaces.repo.path)" checkout FETCH_HEAD
                # Derive image tag: {v<semver> from .version}-{short sha}.
                # .version holds the v-prefixed base tag (e.g. v0.1.0).
                VER="$(cat "$(workspaces.repo.path)/.version")"
                SHA="$(git -C "$(workspaces.repo.path)" rev-parse --short HEAD)"
                printf '%s-%s' "$VER" "$SHA" | tee "$(results.semver-tag.path)"
        workspaces:
          - name: repo
            workspace: repo
          - name: basic-auth
            workspace: basic-auth
      - name: ci-gate
        runAfter:
          - fetch-source
        taskSpec:
          # The same gate the standalone hydradb-operator-ci PipelineRun
          # applies (see .tekton/hydradb-operator-ci.yaml). Tekton and PaC
          # have no cross-pipeline dependency, so this pipeline runs the gate
          # inline rather than duplicating a build: tests first, then image.
          workspaces:
            - name: repo
          # Same CA-bundle mount and toolchain pin as the standalone CI
          # pipeline: the image's own bundle is not trustworthy on every node,
          # and RUSTUP_TOOLCHAIN stops rustup from syncing a channel over the
          # network.
          volumes:
            - name: ca-bundle
              configMap:
                name: kaniko-ca-bundle
          steps:
            - name: rust-checks
              image: docker.io/library/rust:1.92.0
              workingDir: $(workspaces.repo.path)
              env:
                - name: SSL_CERT_FILE
                  value: /etc/ssl/certs/ca-certificates.crt
                - name: RUSTUP_TOOLCHAIN
                  value: 1.92.0-x86_64-unknown-linux-gnu
              volumeMounts:
                - name: ca-bundle
                  mountPath: /etc/ssl/certs/ca-certificates.crt
                  subPath: ca-certificates.crt
                  readOnly: true
              script: |
                #!/bin/sh
                set -euo pipefail
                # rust2go/bindgen needs libclang at build time, and every
                # Tekton step is its own container, so install it here.
                # ca-certificates is deliberately NOT installed: the bundle
                # above is mounted read-only over that path.
                apt-get update -qq
                apt-get install -y -qq clang libclang-dev
                # The image's pinned toolchain ships neither rustfmt nor clippy
                # (rust-toolchain.toml asks for both, profile = minimal); the mounted CA
                # bundle makes the download work.
                rustup component add rustfmt clippy
                # rust2go's build script runs `go build` over the envtest crate's go/
                # module, and that module declares `go 1.26.4`, so install the official
                # tarball (never apt/snap).
                curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go1.26.4.linux-amd64.tar.gz
                tar -C /usr/local -xzf /tmp/go.tgz
                export PATH="/usr/local/go/bin:$PATH"
                go version
                cargo fmt --all --check
                cargo clippy --workspace --all-targets -- -D warnings
                cargo test --workspace
                cargo xtask gen-all --check
            - name: chart-checks
              image: docker.io/alpine/helm:3.20.1
              workingDir: $(workspaces.repo.path)
              script: |
                #!/bin/sh
                set -euo pipefail
                apk add --no-cache git
                helm lint --strict charts/hydradb-operator
                helm plugin install --version v1.2.1 https://github.com/helm-unittest/helm-unittest
                helm unittest charts/hydradb-operator
                helm template hydradb-operator charts/hydradb-operator > "$(workspaces.repo.path)/.ci-render.yaml"
            - name: kubeconform
              # The official image is FROM scratch: no /bin/sh, so this step
              # must use command/args and never `script:`.
              image: ghcr.io/yannh/kubeconform:v0.7.0
              command: ["/kubeconform"]
              args:
                - -strict
                - -summary
                - -schema-location
                - default
                - -schema-location
                - https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
                - -exit-on-error
                - $(workspaces.repo.path)/.ci-render.yaml
        workspaces:
          - name: repo
            workspace: repo
      - name: build-push
        runAfter:
          - fetch-source
          - ci-gate
        taskSpec:
          params:
            - name: image-tag
          workspaces:
            - name: source
            - name: docker-credentials
          volumes:
            - name: ca-bundle
              configMap:
                name: kaniko-ca-bundle
          stepTemplate:
            # Kaniko runs the Dockerfile against its own unpacked root; mounting
            # the CA bundle at /etc/ssl/certs/ca-certificates.crt shadowed that
            # path read-only and broke any image step touching it (apt's
            # ca-certificates postinst, COPY of the bundle). Mount it at a
            # neutral path and trust it via SSL_CERT_FILE instead.
            env:
              - name: SSL_CERT_FILE
                value: /kaniko/ca/ca-certificates.crt
            volumeMounts:
              - name: ca-bundle
                mountPath: /kaniko/ca/ca-certificates.crt
                subPath: ca-certificates.crt
                readOnly: true
          steps:
            - name: build-and-push
              # Kaniko builds the repo-root Dockerfile (which uses the `bin=`
              # export stage); the Rust build happens inside the Dockerfile,
              # never in this step.
              image: ghcr.io/osscontainertools/kaniko:v1.29.0@sha256:0c0b6c02991bba44090fad918ae177d193e1bd3fd0ccc643e7cc1f9f1a5a373d
              workspaces:
                # kaniko reads config.json from $DOCKER_CONFIG (/kaniko/.docker).
                # The docker-credentials workspace defaults to
                # /workspace/docker-credentials, so mount it where kaniko looks;
                # otherwise kaniko pushes anonymously -> UNAUTHORIZED.
                - name: docker-credentials
                  mountPath: /kaniko/.docker
              args:
                - --dockerfile=$(workspaces.source.path)/Dockerfile
                - --context=$(workspaces.source.path)/
                - --destination=harbor.kubexa.tech/oss/hydradb-operator:$(tasks.fetch-source.results.semver-tag)
                - --destination=ghcr.io/kubexa-technologies/hydradb-operator:$(tasks.fetch-source.results.semver-tag)
                # Dual-registry push from one step has NO precedent in this
                # environment; todo 47 spikes whether kaniko accepts two
                # destinations with a two-auth docker config, else splits it.
                - --cache=true
                - --cache-repo=harbor.kubexa.tech/oss/kaniko-cache
                - --cache-copy-layers=true
                - --cache-ttl=336h
                - --push-retry=3
                - --image-download-retry=3
              env:
                - name: FF_KANIKO_PARALLEL_HASH
                  value: "true"
                - name: FF_KANIKO_DEFER_CACHE_PUSH
                  value: "true"
                - name: FF_KANIKO_ISOLATE_CACHE_PUSH
                  value: "true"
                - name: FF_KANIKO_RESOLVE_CACHE_KEY
                  value: "true"
                - --skip-tls-verify-registry=harbor.kubexa.tech
                - --snapshot-mode=redo
              env:
                - name: DOCKER_CONFIG
                  value: /kaniko/.docker
        params:
          - name: image-tag
            value: $(tasks.fetch-source.results.semver-tag)
        workspaces:
          - name: source
            workspace: repo
          - name: docker-credentials
            workspace: docker-credentials
      - name: force-sync
        runAfter:
          - build-push
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: eso-force-sync
            - name: namespace
              value: tekton-tasks
        params:
          - name: namespaces
            value: tekton-tasks
