---
# Publish a release when a version tag is pushed.
#
# Two tasks with an explicit hand-off: github-app-token mints a one-hour installation
# token, release-publish tags and opens the GitHub Release with it. Nothing durable
# is mounted, so a leak of this run is worth an hour at most.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: hydradb-operator-release
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/on-cel-expression: "event == 'push' && target_branch.startsWith('refs/tags/v')"
spec:
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      nodeSelector:
        site: svt
  pipelineSpec:
    workspaces:
      - name: repo
      - name: basic-auth
      - name: docker-credentials
      - name: keys
    tasks:
      - name: fetch-source
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: git-clone-repo }
            - { name: namespace, value: tekton-tasks }
        params:
          - name: revision
            value: "{{revision}}"
          - name: repo-url
            value: http://gitea-http.gitea:3000/oss/hydradb-operator.git
        workspaces:
          - { name: repo, workspace: repo }
          - { name: basic-auth, workspace: basic-auth }
      - name: chart
        runAfter: [fetch-source]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: chart-publish }
            - { name: namespace, value: tekton-tasks }
        params:
          - name: chart-dir
            value: charts/hydradb-operator
          - name: oci-repo
            value: oci://harbor.kubexa.tech/oss
        workspaces:
          - { name: source, workspace: repo }
          - { name: docker-credentials, workspace: docker-credentials }
      - name: image-refs
        # The image tag carries a derived suffix (v<version>-<timestamp>-<sha>), so the pipeline
        # cannot name it. Ask the registry which tags end in this commit instead of guessing.
        runAfter: [chart]
        taskSpec:
          results:
            - name: refs
          workspaces:
            - name: docker-credentials
          steps:
            - name: resolve
              image: docker.io/alpine:3.21
              script: |
                #!/bin/sh
                set -eu
                apk add --no-cache curl jq >/dev/null
                A=$(sed -n 's/.*"auth"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$(workspaces.docker-credentials.path)"/*.json | head -1)
                U=$(printf %s "$A" | base64 -d | cut -d: -f1)
                P=$(printf %s "$A" | base64 -d | cut -d: -f2-)
                SHA=$(printf '%s' "{{revision}}" | cut -c1-7)
                TAGS=$(curl -sS -u "$U:$P" \
                  "https://harbor.kubexa.tech/api/v2.0/projects/oss/repositories/hydradb-operator/artifacts?page_size=100&with_tag=true" \
                  | jq -r '.[] | .tags[]?.name' | grep -E -- "-${SHA}$" || true)
                # A tag on a commit that touched only workflow files has no image: the build's own
                # path filter decides that, and failing here would block the chart's signature for a
                # reason that has nothing to do with the chart. Report the absence and sign what
                # exists; the release is still signed, and the next commit that changes code gets an
                # image to sign too.
                if [ -z "$TAGS" ]; then
                  echo "no image tag ends in $SHA: signing the chart only"
                fi
                # Chart reference plus every image tag for this commit, one per line.
                {
                  # The chart task already returns a full reference with an oci:// prefix; prefixing
                  # it again produced harbor.../hydradb-operator:oci://harbor.../hydradb-operator:0.1.15,
                  # which is not a reference anything can resolve.
                  printf '%s\n' "$(params.chart-version)" | sed -e 's|^oci://||'
                  for t in $TAGS; do printf 'harbor.kubexa.tech/oss/hydradb-operator:%s\n' "$t"; done
                } > "$(results.refs.path)"
                cat "$(results.refs.path)"
          params:
            - name: chart-version
              value: $(tasks.chart.results.chart)
        params:
          - name: chart-version
            value: $(tasks.chart.results.chart)
        workspaces:
          - { name: docker-credentials, workspace: docker-credentials }
      - name: sign
        runAfter: [image-refs]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: cosign-sign }
            - { name: namespace, value: tekton-tasks }
        params:
          - name: refs
            value: $(tasks.image-refs.results.refs)
        workspaces:
          - { name: keys, workspace: keys }
          - { name: docker-credentials, workspace: docker-credentials }
      - name: dispatch-ghcr
        # After the chart and the image exist, never in parallel with them: the mirror copy
        # reads both from Harbor, and a copy that starts first copies nothing.
        runAfter: [chart]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: github-dispatch }
            - { name: namespace, value: tekton-tasks }
        params:
          - name: github-repo
            value: Kubexa-Technologies/hydradb-operator
          - name: github-token
            value: $(tasks.token.results.token)
          - name: event-type
            value: ghcr-copy
          - name: payload
            value: '{"sha":"{{revision}}","tag":"{{source_branch}}"}'
      - name: token
        runAfter: [fetch-source]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: github-app-token }
            - { name: namespace, value: tekton-tasks }
      - name: release
        runAfter: [token]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: release-publish }
            - { name: namespace, value: tekton-tasks }
        params:
          - name: github-token
            value: "$(tasks.token.results.token)"
          - name: github-repo
            value: Kubexa-Technologies/hydradb-operator
        workspaces:
          - { name: source, workspace: repo }
  workspaces:
    - name: docker-credentials
      secret:
        secretName: docker-config-kaniko-oss
    - name: keys
      secret:
        secretName: cosign-keys
    - name: repo
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteMany]
          resources:
            requests:
              storage: 2Gi
          storageClassName: ceph-cephfs
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
