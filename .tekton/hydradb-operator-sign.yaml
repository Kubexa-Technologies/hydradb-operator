---
# Sign the release artifacts from the cluster, with the cosign keypair that Vault delivers.
#
# Why a second signing path exists at all: Fulcio only issues certificates for OIDC issuers in its
# own configuration, and our Zitadel issuer is not one of them unless we run a private Fulcio. So
# the GitHub workflow signs keyless, and this pipeline signs with a key. Both sign the digest, so a
# signature from either path can be checked with `cosign verify` and a moved tag cannot masquerade
# as a signed release.
#
# Dispatched from the release pipeline for the same ordering reason as the GHCR copy: signing
# something that does not exist yet just fails slowly.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: hydradb-operator-sign
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/on-cel-expression: "event == 'push' && target_branch.startsWith('refs/tags/v')"
spec:
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      nodeSelector:
        site: svt
  pipelineSpec:
    workspaces:
      - name: repo
      - name: basic-auth
      - name: keys
    tasks:
      - name: fetch-source
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: git-clone-repo }
            - { name: namespace, value: tekton-tasks }
        params:
          - name: revision
            value: "{{revision}}"
          - name: repo-url
            value: http://gitea-http.gitea:3000/oss/hydradb-operator.git
        workspaces:
          - { name: repo, workspace: repo }
          - { name: basic-auth, workspace: basic-auth }
      - name: version
        # The chart version is the git tag without its prefix, and PaC hands a tag event its full
        # ref (refs/tags/v0.1.9). A parameter default cannot strip that, so derive it from the
        # clone instead of guessing, and keep the shared signing task generic.
        runAfter: [fetch-source]
        taskSpec:
          results:
            - name: chart-version
          workspaces:
            - name: source
          steps:
            - name: derive
              image: docker.io/alpine:3.21
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                apk add --no-cache git >/dev/null
                tag=$(git describe --tags --exact-match 2>/dev/null || true)
                if [ -z "$tag" ]; then echo "HEAD is not an exact tag"; exit 1; fi
                printf '%s' "${tag#v}" > "$(results.chart-version.path)"
                echo "chart version ${tag#v}"
        workspaces:
          - { name: source, workspace: repo }
      - name: sign
        runAfter: [version]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: cosign-sign }
            - { name: namespace, value: tekton-tasks }
        params:
          - name: refs
            # Chart only, for now: the image tag carries a derived suffix, so signing it needs the
            # build tag and that caller is the release pipeline, not this tag event.
            value: "harbor.kubexa.tech/oss/hydradb-operator:$(tasks.version.results.chart-version)"
        workspaces:
          - { name: keys, workspace: keys }
  workspaces:
    - name: repo
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteMany]
          resources:
            requests:
              storage: 2Gi
          storageClassName: ceph-cephfs
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: keys
      secret:
        secretName: cosign-keys
